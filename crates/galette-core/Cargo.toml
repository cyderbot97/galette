[package]
name = "galette-core"
description = "Secure CD ripping engine: drive access, disc IDs, metadata, AccurateRip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alac = { version = "0.5.0", default-features = false }
alac-encoder = "0.3.0"
base64 = "0.23.1"
claxon = "0.4.3"
crc32fast = "1.5.3"
flacenc = "0.5.1"
id3 = "1.17.2"
metaflac = "0.2.8"
mp3lame-encoder = "0.2.5"
mp4ameta = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
