[package]
name = "galette-core"
description = "Secure CD ripping engine: drive access, disc IDs, metadata, AccurateRip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
claxon = "0.4.3"
flacenc = "0.5.1"
metaflac = "0.2.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
