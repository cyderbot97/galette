<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Galette</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes/cathedrale/theme.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icon.png" alt=""> Galette</div>
    <div id="drive" class="drive"></div>
    <div class="actions">
      <button id="refresh" data-i18n="header.refresh" data-i18n-title="header.refreshTitle"></button>
      <button id="eject" data-i18n="header.eject" data-i18n-title="header.ejectTitle"></button>
      <button id="settings" data-i18n="header.settings" data-i18n-title="header.settingsTitle"></button>
    </div>
  </header>

  <main>
    <section id="empty" class="empty">
      <div class="disc-icon"></div>
      <p id="empty-text" data-i18n="empty.insert"></p>
    </section>

    <section id="album" hidden>
      <div class="album-head">
        <div class="cover"><img id="cover" alt="" hidden><span id="cover-none" data-i18n="album.noCover"></span></div>
        <div class="fields">
          <label class="edition"><span data-i18n="album.edition"></span>
            <select id="release"></select>
          </label>
          <input id="album-artist" class="big" data-i18n-placeholder="album.artist" spellcheck="false">
          <input id="album-title" class="big title" data-i18n-placeholder="album.title" spellcheck="false">
          <div class="row">
            <label><span data-i18n="album.year"></span> <input id="album-date" data-i18n-placeholder="album.yearPlaceholder" spellcheck="false"></label>
          </div>
          <div id="badges" class="badges"></div>
        </div>
      </div>

      <div id="message" class="message" hidden></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="check"><input type="checkbox" id="check-all" checked></th>
              <th class="num">#</th>
              <th data-i18n="tracks.title"></th>
              <th data-i18n="tracks.artist"></th>
              <th class="length" data-i18n="tracks.length"></th>
              <th class="status" data-i18n="tracks.status"></th>
            </tr>
          </thead>
          <tbody id="tracks"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <label class="output"><span data-i18n="footer.folder"></span>
      <span id="output" class="path"></span>
      <button id="browse" data-i18n="footer.browse"></button>
    </label>
    <label><span data-i18n="footer.format"></span>
      <select id="format">
        <option value="flac">FLAC</option>
        <option value="alac">ALAC (Apple Lossless)</option>
        <option value="aac">AAC (Apple, 256 kbit/s)</option>
        <option value="mp3">MP3</option>
        <option value="aiff">AIFF</option>
        <option value="wav">WAV</option>
      </select>
    </label>
    <label><span data-i18n="footer.mode"></span>
      <select id="mode">
        <option value="secure" data-i18n="footer.secure"></option>
        <option value="burst" data-i18n="footer.burst"></option>
      </select>
    </label>
    <button id="rip" class="primary" disabled data-i18n="rip.start"></button>
  </footer>

  <dialog id="prefs">
    <form method="dialog">
      <h2 data-i18n="settings.title"></h2>

      <fieldset>
        <legend data-i18n="settings.naming"></legend>
        <label><span data-i18n="settings.albumFolder"></span>
          <input id="pref-folder" spellcheck="false">
        </label>
        <label><span data-i18n="settings.trackFile"></span>
          <input id="pref-file" spellcheck="false">
        </label>
        <p class="hint" data-i18n-html="settings.fields"></p>
        <p class="preview"><span data-i18n="settings.example"></span><span id="pref-preview"></span></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="settings.reading"></legend>
        <label class="inline">
          <input type="checkbox" id="pref-manual-offset"> <span data-i18n="settings.manualOffset"></span>
          <input id="pref-offset" type="number" step="1" value="0">
          <span class="hint" id="pref-offset-auto"></span>
        </label>
        <div class="tool">
          <button type="button" id="pref-detect-offset" data-i18n="settings.detectOffset"></button>
          <span class="hint" id="pref-offset-result"></span>
        </div>
        <label class="inline">
          <input type="checkbox" id="pref-c2"> <span data-i18n="settings.c2"></span>
          <span class="hint" data-i18n="settings.c2Hint"></span>
        </label>
        <div class="tool">
          <button type="button" id="pref-test-cache" data-i18n="settings.testCache"></button>
          <span class="hint" id="pref-cache-result"></span>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="settings.quality"></legend>
        <label class="inline">MP3
          <select id="pref-mp3-quality">
            <option value="v0" data-i18n="settings.mp3V0"></option>
            <option value="v2" data-i18n="settings.mp3V2"></option>
            <option value="cbr320" data-i18n="settings.mp3Cbr320"></option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend data-i18n="settings.coverAndDisc"></legend>
        <label class="inline"><input type="checkbox" id="pref-embed"> <span data-i18n="settings.embedCover"></span></label>
        <label class="inline"><input type="checkbox" id="pref-save-cover"> <span data-i18n="settings.saveCover"></span></label>
        <label class="inline"><input type="checkbox" id="pref-eject"> <span data-i18n="settings.eject"></span></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="settings.appearance"></legend>
        <label class="inline"><span data-i18n="settings.theme"></span>
          <select id="pref-theme">
            <option value="classic" data-i18n="settings.themeClassic"></option>
            <option value="cathedrale" data-i18n="settings.themeCathedrale"></option>
          </select>
        </label>
        <label class="inline"><span data-i18n="settings.language"></span>
          <select id="pref-language">
            <option value="auto" data-i18n="settings.languageAuto"></option>
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
        </label>
      </fieldset>

      <div class="dialog-buttons">
        <button value="cancel" formnovalidate data-i18n="settings.cancel"></button>
        <button value="save" class="primary" id="pref-save" data-i18n="settings.save"></button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
