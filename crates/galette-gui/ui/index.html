<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Galette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icon.png" alt=""> Galette</div>
    <div id="drive" class="drive"></div>
    <div class="actions">
      <button id="refresh" title="Relire le disque">↻ Actualiser</button>
      <button id="eject" title="Ouvrir le tiroir">⏏ Éjecter</button>
      <button id="settings" title="Réglages">⚙ Réglages</button>
    </div>
  </header>

  <main>
    <section id="empty" class="empty">
      <div class="disc-icon"></div>
      <p id="empty-text">Insérez un CD audio.</p>
    </section>

    <section id="album" hidden>
      <div class="album-head">
        <div class="cover"><img id="cover" alt="" hidden><span id="cover-none">Pas de pochette</span></div>
        <div class="fields">
          <label class="edition">Édition
            <select id="release"></select>
          </label>
          <input id="album-artist" class="big" placeholder="Artiste" spellcheck="false">
          <input id="album-title" class="big title" placeholder="Titre de l'album" spellcheck="false">
          <div class="row">
            <label>Année <input id="album-date" placeholder="AAAA" spellcheck="false"></label>
          </div>
          <div id="badges" class="badges"></div>
        </div>
      </div>

      <div id="message" class="message" hidden></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="check"><input type="checkbox" id="check-all" checked></th>
              <th class="num">#</th>
              <th>Titre</th>
              <th>Artiste</th>
              <th class="length">Durée</th>
              <th class="status">État</th>
            </tr>
          </thead>
          <tbody id="tracks"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <label class="output">Dossier
      <span id="output" class="path"></span>
      <button id="browse">Parcourir…</button>
    </label>
    <label>Format
      <select id="format">
        <option value="flac">FLAC</option>
        <option value="alac">ALAC (Apple Lossless)</option>
        <option value="mp3">MP3</option>
        <option value="aiff">AIFF</option>
        <option value="wav">WAV</option>
      </select>
    </label>
    <label>Mode
      <select id="mode">
        <option value="secure">Sécurisé</option>
        <option value="burst">Rapide</option>
      </select>
    </label>
    <button id="rip" class="primary" disabled>Ripper</button>
  </footer>

  <dialog id="prefs">
    <form method="dialog">
      <h2>Réglages</h2>

      <fieldset>
        <legend>Nommage</legend>
        <label>Dossier de l'album
          <input id="pref-folder" spellcheck="false">
        </label>
        <label>Fichier de chaque piste
          <input id="pref-file" spellcheck="false">
        </label>
        <p class="hint">
          Champs : <code>{albumartist}</code> <code>{album}</code> <code>{year}</code> <code>{disc}</code>
          <code>{disccount}</code>, et pour les fichiers <code>{track}</code> <code>{title}</code> <code>{artist}</code>.
          Un <code>/</code> dans le dossier crée des sous-dossiers.
        </p>
        <p class="preview">Exemple : <span id="pref-preview"></span></p>
      </fieldset>

      <fieldset>
        <legend>Lecture</legend>
        <label class="inline">
          <input type="checkbox" id="pref-manual-offset"> Décalage de lecture manuel
          <input id="pref-offset" type="number" step="1" value="0">
          <span class="hint" id="pref-offset-auto"></span>
        </label>
        <label class="inline">
          <input type="checkbox" id="pref-c2"> Utiliser les pointeurs C2
          <span class="hint">(à décocher si le lecteur les gère mal)</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Qualité</legend>
        <label class="inline">MP3
          <select id="pref-mp3-quality">
            <option value="v0">VBR V0 (≈ 245 kbit/s, recommandé)</option>
            <option value="v2">VBR V2 (≈ 190 kbit/s)</option>
            <option value="cbr320">CBR 320 kbit/s</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Pochette et disque</legend>
        <label class="inline"><input type="checkbox" id="pref-embed"> Intégrer la pochette dans les fichiers (sauf WAV)</label>
        <label class="inline"><input type="checkbox" id="pref-save-cover"> Enregistrer la pochette (cover.jpg)</label>
        <label class="inline"><input type="checkbox" id="pref-eject"> Éjecter le disque à la fin du rip</label>
      </fieldset>

      <div class="dialog-buttons">
        <button value="cancel" formnovalidate>Annuler</button>
        <button value="save" class="primary" id="pref-save">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
